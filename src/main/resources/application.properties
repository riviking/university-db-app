spring.application.name=university-db-app

# ---- MySQL connection (XAMPP defaults: user root, empty password) ----
spring.datasource.url=jdbc:mysql://localhost:3306/university_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# ---- JPA / Hibernate ----
# validate = only CHECK that entities match the existing tables. Never change the schema.
spring.jpa.hibernate.ddl-auto=validate./mvnw spring-boot:run
spring.jpa.show-sql=true
spring.jpa.open-in-view=false